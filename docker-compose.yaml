# Coolify notes:
# - File MUST be named docker-compose.yaml (.yaml) - Coolify's default path.
# - No ports published anywhere; nothing is public yet. When you add the web
#   dashboard later, give THAT service the coolify network + traefik labels.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - studystation-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  sync:
    build:
      context: .
      dockerfile: sync/Dockerfile
    # tini takes PID1 so supercronic runs as a normal child; supercronic's own
    # PID1 reaper (v0.2.33) fatals with "Failed to fork exec" in this image.
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CANVAS_BASE_URL: ${CANVAS_BASE_URL}
      # Session delivered as env var (Coolify-friendly). If empty, the job
      # falls back to CANVAS_SESSION_FILE (bind-mount it yourself if used).
      CANVAS_SESSION_JSON: ${CANVAS_SESSION_JSON}
      CANVAS_SESSION_FILE: ${CANVAS_SESSION_FILE:-/data/canvas_session.json}
      SYNC_SCHEDULE: ${SYNC_SCHEDULE:-0 3 * * *}
      RUN_ONCE: ${RUN_ONCE:-0}
      CAL_WINDOW_DAYS_BACK: ${CAL_WINDOW_DAYS_BACK:-120}
      CAL_WINDOW_DAYS_AHEAD: ${CAL_WINDOW_DAYS_AHEAD:-240}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    networks: [default, coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.studystation.rule=Host(`studystation.jewellcore.com`)
      - traefik.http.routers.studystation.entrypoints=http
      - traefik.http.services.studystation.loadbalancer.server.port=80
    restart: unless-stopped

volumes:
  studystation-db:

networks:
  coolify:
    external: true

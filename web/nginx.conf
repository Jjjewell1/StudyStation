server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API stub. When the backend (reading Postgres) is added as a service
    # named `api`, replace this block with:
    #
    #   location /api/ {
    #       proxy_pass http://api:8000;
    #       proxy_set_header Host $host;
    #   }
    #
    # (Do NOT proxy_pass to a host that doesn't exist yet — nginx fails to
    #  start on DNS resolution error.)
    location /api/ {
        default_type application/json;
        return 503 '{"error":"API backend not wired up yet"}';
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
